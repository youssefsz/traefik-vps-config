services:
  traefik:
    image: traefik:v3.6.6
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080" # Dashboard port (Enable only for debugging with --api.insecure=true)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
      - ./acme-cloudflare.json:/acme-cloudflare.json
      - ./dynamic:/dynamic:ro # Dynamic config directory
    environment:
      - "CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token"
    secrets:
      - cloudflare_dns_api_token
    networks:
      - traefik
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command:
      - "--log.level=INFO"

      # Enable Dashboard (configure via labels to access securely)
      - "--api.dashboard=true"

      # Docker Provider configuration
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false" # Only expose containers with traefik.enable=true
      - "--providers.docker.network=traefik" # Use the shared network

      # File Provider for dynamic configuration (middlewares, etc.)
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

      # Entrypoints (Ports)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Global HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"

      # Existing resolver for domains that connect directly to this VPS
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=dhibi.ywsf@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"

      # Resolver for Cloudflare-proxied youssef.tn and dhibi.tn services
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=dhibi.ywsf@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/acme-cloudflare.json"

secrets:
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token

networks:
  traefik:
    external: true
